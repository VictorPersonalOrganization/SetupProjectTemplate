name: Unity Build (Self-Hosted PC)

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: "6000.5.4f1"
  PROJECT_FOLDER: "."
  BUILD_METHOD: "BuildScript.BuildWindows"
  BUILD_OUTPUT_DIR: "Builds/Windows"
  EXE_NAME: "SetupProjectTemplate.exe"

jobs:
  build-local:
    name: Build Local (Self-Hosted PC)
    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build Executable
        shell: cmd
        run: '"C:\Program Files\Unity\Hub\Editor\%UNITY_VERSION%\Editor\Unity.exe" -batchmode -quit -projectPath "%GITHUB_WORKSPACE%\%PROJECT_FOLDER%" -executeMethod %BUILD_METHOD% -customBuildDir "%BUILD_OUTPUT_DIR%" -customExeName "%EXE_NAME%" -logFile -'

      - name: Zip Build
        shell: powershell
        run: |
          $buildPath = "${env:BUILD_OUTPUT_DIR}"
          $zipDir = "Builds"
          $zipPath = "$zipDir\Build-Windows-Local.zip"
          if (-not (Test-Path $zipDir)) { New-Item -ItemType Directory -Path $zipDir }
          if (Test-Path $buildPath) {
              Compress-Archive -Path "$buildPath\*" -DestinationPath $zipPath -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows-Local
          path: Builds/Build-Windows-Local.zip
          if-no-files-found: ignore